<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="194" viewBox="0 0 1120 194" role="img" aria-labelledby="title desc">
  <title id="title">작업 방식</title>
  <desc id="desc">개발용 인프라 구축, 테스트, 피드백, 운영용 인프라 구축, 테스트, 피드백, 교차 수행의 순서</desc>
  <style>
    .line { fill: none; stroke: #2a5d8f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .frame { fill: #fff; stroke: #2a5d8f; stroke-width: 3; }
    .light { fill: #eaf0f6; stroke: #2a5d8f; stroke-width: 2.5; }
    .label { fill: #0b2545; font: 600 22px "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <g id="infrastructure">
      <rect class="frame" x="-45" y="27" width="90" height="78" rx="3"/>
      <path class="line" d="M-45 43h90"/>
      <circle cx="-34" cy="35" r="2.8" fill="#2a5d8f"/>
      <circle cx="-25" cy="35" r="2.8" fill="#2a5d8f"/>
      <rect class="light" x="-34" y="58" width="18" height="33" rx="2"/>
      <rect class="light" x="-11" y="58" width="18" height="33" rx="2"/>
      <rect class="light" x="12" y="58" width="18" height="33" rx="2"/>
      <path class="line" d="M-30 68h10 M-30 78h10 M-7 68h10 M-7 78h10 M16 68h10 M16 78h10"/>
    </g>
    <g id="test">
      <circle class="frame" cx="0" cy="67" r="38"/>
      <path class="line" d="m-18 67 12 12 25-28" stroke-width="4.5"/>
    </g>
    <g id="feedback">
      <path class="light" d="M-38 30h76v56H-5l-20 18V86h-13z"/>
      <path class="line" d="M-22 47h44 M-22 59h44 M-22 71h28"/>
    </g>
    <path id="arrow" class="line" d="M0 67h30m-9-8 9 8-9 8"/>
  </defs>

  <!-- Development infrastructure, test, and feedback -->
  <use href="#infrastructure" x="90"/>
  <text class="label" x="90" y="150"><tspan x="90">개발용 인프라</tspan><tspan x="90" dy="25">구축</tspan></text>
  <use href="#arrow" x="155"/>
  <use href="#test" x="245"/>
  <text class="label" x="245" y="162">테스트</text>
  <use href="#arrow" x="305"/>
  <use href="#feedback" x="400"/>
  <text class="label" x="400" y="162">피드백</text>
  <use href="#arrow" x="465"/>

  <!-- Production infrastructure, test, and feedback -->
  <use href="#infrastructure" x="565"/>
  <text class="label" x="565" y="150"><tspan x="565">운영용 인프라</tspan><tspan x="565" dy="25">구축</tspan></text>
  <use href="#arrow" x="635"/>
  <use href="#test" x="730"/>
  <text class="label" x="730" y="162">테스트</text>
  <use href="#arrow" x="790"/>
  <use href="#feedback" x="885"/>
  <text class="label" x="885" y="162">피드백</text>
  <use href="#arrow" x="945"/>

  <!-- Cross-team execution -->
  <g transform="translate(15 0)">
    <path class="line" d="M981 56c6-18 22-29 43-29 16 0 29 7 37 18m-9-19 9 19-21-1"/>
    <path class="line" d="M1069 78c-6 18-22 29-43 29-16 0-29-7-37-18m9 19-9-19 21 1"/>
    <circle class="light" cx="1010" cy="67" r="11"/>
    <circle class="light" cx="1044" cy="67" r="11"/>
    <text class="label" x="1025" y="162">교차 수행</text>
  </g>
</svg>
