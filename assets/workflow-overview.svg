    .light { fill: #eaf0f6; stroke: #2a5d8f; stroke-width: 2.5; }
    .label { fill: #0b2545; font: 600 22px "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: middle; }
